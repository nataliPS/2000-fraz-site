{{>_head}}
<body class="p-psdinfo">
<a class="skip" href="#main">{{skip}}</a>
<header class="top">
  <div class="wrap">
    <div class="crumb">
      <a class="logo" href="{{L}}" aria-label="{{home_aria}}"><img src="{{R}}assets/orizo-logo-white.svg" alt="Orizo" width="529" height="148"></a>
      <span>{{psvc_name}}</span>
    </div>
    <nav aria-label="{{nav_aria}}">
      <a class="hide-sm" href="{{L}}#products">{{nav_all}}</a>
      {{>_langmenu}}
    </nav>
  </div>
</header>

<main id="main">
  <section class="sky sky-plain dir-hero">
    <div class="wrap">
      <p class="psd-badge"><span>Orizo Labs</span> × <span>PSDinfo</span></p>
      <span class="status">{{status_dev}}</span>
      <h1 style="margin-top:20px">{{psvc_name}}</h1>
      <p class="lead">{{tp_lead}}</p>
      <div class="actions">
        <a class="btn btn-sun" href="mailto:hello@orizolabs.com?subject={{tp_subj|url}}">{{write_us}}</a>
      </div>
    </div>
  </section>
</main>
{{>_foot}}
