<!doctype html>
<html lang="{{lang}}" class="no-js">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.replace("no-js","js")</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="icon" href="{{R}}assets/favicon-32.png" sizes="32x32">

<meta property="og:image" content="https://orizolabs.com/assets/og.png">
<meta property="og:url" content="{{URL}}">
<meta property="og:locale" content="{{og_locale}}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500&display=swap" rel="stylesheet">
